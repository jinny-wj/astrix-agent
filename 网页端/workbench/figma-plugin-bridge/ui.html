<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>body{font:13px -apple-system,sans-serif;margin:16px;background:#f5f5f8;color:#252334}h2{font-size:17px}label{display:block;margin:10px 0}input{box-sizing:border-box;width:100%;padding:8px;border:1px solid #ccc;border-radius:5px}button{padding:8px 12px;margin-right:8px;border:0;border-radius:5px;background:#7055bd;color:white}#log{height:190px;overflow:auto;white-space:pre-wrap;background:white;padding:10px}#status{color:#7055bd}</style>
<h2>Astrix · Figma 桥接</h2><p id="status">正在读取真实 Figma 文件…</p><label>本机服务<input id="base" value="http://127.0.0.1:4317"></label><label>Astrix 页面显示的配对码<input id="code" placeholder="12 位配对码" autocomplete="off"></label><button id="pair">配对当前文件</button><button id="disconnect">断开并清除凭据</button><pre id="log"></pre>
<script>
const $=id=>document.getElementById(id);let snapshot=null,credentials=null,restored=false,authorized=false,resuming=null,busy=false,upload=Promise.resolve(),lastUpload=0;const logs=[];
function log(text){logs.unshift(new Date().toLocaleTimeString()+' '+String(text));$('log').textContent=logs.slice(0,30).join('\n')}
function base(){const u=new URL($('base').value.trim());if(u.protocol!=='http:'||!['127.0.0.1','localhost','[::1]'].includes(u.hostname)||u.username||u.password||u.pathname!=='/'||u.search||u.hash)throw Error('仅允许本机 HTTP 服务');return u.origin}
async function request(path,body,auth=true){const headers={};if(body)headers['content-type']='application/json';if(auth){if(!credentials||!snapshot)throw Error('请先配对');headers.authorization='Bearer '+credentials.token}const r=await fetch(base()+'/__local/figma/bridge/'+path,{method:body?'POST':'GET',headers,body:body?JSON.stringify(body):undefined});const value=await r.json();if(!r.ok)throw Object.assign(Error(value.error||'请求失败 '+r.status),{status:r.status});return value}
const scope=()=>({fileKey:snapshot.fileKey,sessionId:snapshot.sessionId});
function persist(){parent.postMessage({pluginMessage:{type:'save-pairing',credentials:{...credentials,base:base(),...scope()}}},'*')}
function publish(){if(!authorized||!credentials||!snapshot)return;const current=snapshot;upload=upload.catch(()=>{}).then(()=>request('selection',{...scope(),snapshot:current})).then(()=>{lastUpload=Date.now();$('status').textContent='已配对 · '+snapshot.documentName+' · '+snapshot.nodes.length+' 个选中图层'}).catch(error=>{log(error.message);if(error.status===401||error.status===403){credentials=null;authorized=false;$('status').textContent='凭据失效，请重新配对'}})}
async function resume(){if(resuming)return resuming;if(!restored||!snapshot||!credentials)return;if(credentials.fileKey!==snapshot.fileKey){credentials=null;authorized=false;log('保存的凭据属于其他文件，请为当前文件配对');return}resuming=(async()=>{try{if(credentials.base)$('base').value=credentials.base;const value=await request('pair',{token:credentials.token,...scope()},false);credentials={...value,base:base()};authorized=true;persist();publish()}catch(error){credentials=null;authorized=false;log('恢复配对失败：'+error.message)}})().finally(()=>resuming=null);return resuming}
$('pair').onclick=async()=>{if(!snapshot?.fileKey){log('没有 fileKey；请使用 Desktop 开发插件或组织私有插件');return}try{credentials=await request('pair',{code:$('code').value.trim(),...scope()},false);authorized=true;$('code').value='';persist();publish();log('已绑定当前 Figma 文件')}catch(error){log(error.message)}};
$('disconnect').onclick=()=>{credentials=null;authorized=false;parent.postMessage({pluginMessage:{type:'clear-pairing'}},'*');$('status').textContent='已断开；可在 Astrix 页面撤销配对令牌'};
window.onmessage=event=>{if(event.source!==parent)return;const m=event.data?.pluginMessage;if(!m)return;if(m.type==='bridge-ready'){credentials=m.credentials;restored=true;void resume()}if(m.type==='selection-snapshot'){snapshot=m.snapshot;if(!snapshot.fileKey){$('status').textContent='无法读取 fileKey；请检查私有 API / 开发插件权限';return}if(authorized&&credentials&&credentials.sessionId===snapshot.sessionId)publish();else if(restored)void resume()}if(m.type==='ack-results'&&authorized&&credentials){void upload.then(()=>request('ack',{...scope(),results:m.results})).then(()=>log('收到真实执行回执：'+m.results.map(r=>r.ok?'成功':'失败 '+(r.message||'')).join('；'))).catch(error=>log('回执提交失败，将按相同命令 ID 重试：'+error.message))}};
setInterval(async()=>{if(!authorized||!credentials||!snapshot||busy)return;busy=true;try{await upload;if(Date.now()-lastUpload>5000){publish();await upload}const q=new URLSearchParams(scope());const value=await request('pull?'+q);if(value.commands?.length)parent.postMessage({pluginMessage:{type:'apply-commands',commands:value.commands}},'*')}catch(error){log(error.message)}finally{busy=false}},1000);
parent.postMessage({pluginMessage:{type:'ui-ready'}},'*');
</script></html>
