<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; object-src 'none'; frame-src 'none'; base-uri 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>星序 Astrix</title>
    <link rel="stylesheet" href="./shell.css" />
  </head>
  <body data-mode="home">
    <header class="titlebar">
      <div class="traffic-light-space" aria-hidden="true"></div>
      <div class="brand" aria-label="星序 Astrix">
        <svg width="26" height="26" viewBox="428 315 372 304" aria-hidden="true">
          <image href="./assets/astrix-logo.png" width="1672" height="941" />
        </svg>
      </div>
      <div class="tabs" role="tablist" aria-label="工作区标签" data-tabs></div>
      <button
        class="chrome-button new-button"
        type="button"
        data-action="new-figma"
        aria-label="新建 Figma 设计稿"
        title="新建 Figma 设计稿 (⌘T)"
      >
        <span aria-hidden="true">＋</span>
      </button>
      <div class="titlebar-spacer"></div>
      <span class="server-state" data-server-state title="客户端本地服务" hidden>
        <i aria-hidden="true"></i>
        <span data-server-label>本地服务</span>
      </span>
      <div class="header-actions" aria-label="应用操作">
        <button class="header-icon" type="button" data-action="go-home" aria-label="返回首页" title="返回首页">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9M9 16h6" /></svg>
        </button>
        <button class="header-icon" type="button" data-action="open-settings" aria-label="设置" title="设置">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-.6 2.2-1.8 1.1-2.2-.5-2 3.4 1.6 1.6v2.3L2.4 15l2 3.4 2.2-.5 1.8 1.1.6 2.2h4l.6-2.2 1.8-1.1 2.2.5 2-3.4-1.6-1.6v-2.3l1.6-1.9-2-3.4-2.2.5-1.8-1.1L13 3Z" /><circle cx="11" cy="12" r="3" /></svg>
        </button>
        <button class="header-avatar" type="button" data-action="open-account" aria-label="账号" title="账号">
          <img data-profile-image alt="" referrerpolicy="no-referrer" hidden />
          <svg data-profile-placeholder viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5" /><path d="M5 21v-2a7 7 0 0 1 14 0v2" /></svg>
        </button>
      </div>
    </header>

    <nav class="navigation" aria-label="Figma 页面导航" data-navigation>
      <div class="navigation-actions">
        <button type="button" data-action="back" aria-label="后退" title="后退 (⌘[)">‹</button>
        <button type="button" data-action="forward" aria-label="前进" title="前进 (⌘])">›</button>
        <button type="button" data-action="reload" aria-label="刷新" title="刷新 (⌘R)">
          <span data-reload-icon>↻</span>
        </button>
      </div>
      <div class="location" title="真实 Figma 页面">
        <span class="location-lock" aria-hidden="true">⌁</span>
        <span class="location-text" data-location>figma.com</span>
      </div>
      <div class="workspace-status">
        <span class="workspace-dot" aria-hidden="true"></span>
        <span>Figma 工作区</span>
      </div>
      <button class="agent-toggle" type="button" data-action="toggle-agent" aria-pressed="true" title="显示或隐藏 Agent (⌘\\)"><span class="agent-spark" aria-hidden="true">✦</span> Agent</button>
      <button
        class="bridge-help"
        type="button"
        data-action="install-bridge"
        title="查看本地 Bridge 文件：仅供 Figma 官方桌面版导入；内嵌页面需要已发布的插件"
      >
        Bridge 文件
      </button>
    </nav>

    <main class="shell-background" aria-hidden="true"></main>
    <nav class="workspace-rail" aria-label="应用工作区导航">
      <button type="button" data-action="focus-layers" title="返回 Figma 图层与画布" aria-label="图层：返回 Figma 画布">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5" /></svg>
        <span>图层</span>
      </button>
      <button type="button" data-action="open-skills" title="在 AI 助手中选择技能" aria-label="技能：打开技能列表">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 3 1.8 5.2L21 10l-5.2 1.8L14 17l-1.8-5.2L7 10l5.2-1.8L14 3ZM5 14l1 3 3 1-3 1-1 3-1-3-3-1 3-1 1-3Z" /></svg>
        <span>技能</span>
      </button>
    </nav>
    <script src="./shell.js"></script>
  </body>
</html>
