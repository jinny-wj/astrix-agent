<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>连接 Figma · Astrix</title>
    <link rel="stylesheet" href="./figma-oauth-setup.css" />
  </head>
  <body>
    <main>
      <div class="app-mark" aria-hidden="true">A</div>
      <h1>连接 Figma</h1>
      <p class="intro">先填写 Astrix 的应用连接信息。保存后将在系统浏览器打开 Figma 官方授权页，由你确认权限。</p>
      <form id="oauth-form" autocomplete="off">
        <label for="client-id">Client ID</label>
        <input id="client-id" name="clientId" type="text" required maxlength="4096" autocomplete="off" autocapitalize="none" spellcheck="false" autofocus />
        <label for="client-secret">Client Secret</label>
        <input id="client-secret" name="clientSecret" type="password" required maxlength="4096" autocomplete="off" autocapitalize="none" spellcheck="false" />
        <p class="storage-note">连接信息通过系统安全存储加密，仅保存在这台电脑上。</p>
        <p id="status" role="status" aria-live="polite"></p>
        <button id="submit-button" type="submit">保存并在浏览器继续</button>
      </form>
      <a class="management-link" href="https://www.figma.com/developers/apps" target="_blank" rel="noopener noreferrer">打开 Figma 应用管理页 ↗</a>
    </main>
    <script src="./figma-oauth-setup.js"></script>
  </body>
</html>
