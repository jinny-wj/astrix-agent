<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <!--
    中性品牌图形占位：抽象的分层几何构成，不指向任何具体角色形象。
    如需替换为自有吉祥物或插画，整体覆盖本文件即可。
  -->
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fb2f0" />
      <stop offset="1" stop-color="#4a7fd6" />
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9d6ea" />
      <stop offset="1" stop-color="#9fb4d4" />
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#eef3fa" />
      <stop offset="1" stop-color="#d5e2f2" />
    </linearGradient>
  </defs>

  <!-- 底层圆盘 -->
  <ellipse cx="100" cy="176" rx="58" ry="14" fill="#e8eef6" />

  <!-- 主体：叠放的三层圆角方块，象征图层 -->
  <rect x="52" y="118" width="96" height="46" rx="12" fill="url(#g2)" />
  <rect x="62" y="80" width="76" height="46" rx="12" fill="url(#g3)" />
  <rect x="70" y="42" width="60" height="46" rx="12" fill="url(#g1)" />

  <!-- 顶层方块内的抽象标记 -->
  <circle cx="88" cy="65" r="6" fill="#ffffff" opacity="0.9" />
  <rect x="100" y="59" width="18" height="4" rx="2" fill="#ffffff" opacity="0.75" />
  <rect x="100" y="68" width="12" height="4" rx="2" fill="#ffffff" opacity="0.55" />

  <!-- 右上装饰星形 -->
  <path d="M154 34l2.6 7 7 2.6-7 2.6L154 53l-2.6-6.8-7-2.6 7-2.6z" fill="#8fb8ef" />
  <path d="M170 58l1.6 4.2 4.2 1.6-4.2 1.6-1.6 4.2-1.6-4.2-4.2-1.6 4.2-1.6z" fill="#bcd2ef" />
